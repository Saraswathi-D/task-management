<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Task Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
        <header class="header">
            <div class="brand">
                <div class="logo">T</div>
                <div>
                    <h1>TaskFlow</h1>
                    <p>Manage your tasks with ease</p>
                </div>
            </div>

            <div class="stats">
                <span id="totalTasks">10</span>
                <small>Total Tasks</small>
            </div>

            <div class="header-actions">
                <div class="progress-summary">
                    <strong id="completionPercentage">30%</strong>
                    <small>Completed</small>
                </div>
                <button class="primary-button" id="addTaskButton" type="button">+ Add Task</button>
            </div>
        </header>

        <div class="board-controls">
            <label class="search-box" for="searchInput">
                <span aria-hidden="true">⌕</span>
                <input id="searchInput" type="search" placeholder="Search tasks by title..." autocomplete="off">
            </label>
            <label class="filter-box" for="priorityFilter">
                <span>Priority</span>
                <select id="priorityFilter">
                    <option value="all">All Priorities</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
            </label>
        </div>

        <div class="board">

            <section class="column todo-column">
                <div class="column-title">
                    <div>
                        <span class="status-dot todo-dot"></span>
                        <h2>To Do</h2>
                    </div>
                    <span class="count" id="todoCount">4</span>
                </div>

                <p class="column-description">Tasks waiting to be started</p>

                <div class="task-list" data-status="todo"></div>
            </section>

            <section class="column progress-column">
                <div class="column-title">
                    <div>
                        <span class="status-dot progress-dot"></span>
                        <h2>In Progress</h2>
                    </div>
                    <span class="count" id="progressCount">3</span>
                </div>

                <p class="column-description">Tasks currently in progress</p>

                <div class="task-list" data-status="progress"></div>
            </section>

            <section class="column completed-column">
                <div class="column-title">
                    <div>
                        <span class="status-dot completed-dot"></span>
                        <h2>Completed</h2>
                    </div>
                    <span class="count" id="completedCount">3</span>
                </div>

                <p class="column-description">Successfully completed tasks</p>

                <div class="task-list" data-status="completed"></div>
            </section>

        </div>
    </div>

    <div class="drop-message" id="dropMessage">Drop task here</div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="modal-backdrop" id="taskModal" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-header">
                <div>
                    <p class="modal-eyebrow">Task details</p>
                    <h2 id="modalTitle">Add New Task</h2>
                </div>
                <button class="icon-button close-modal" id="closeModalButton" type="button" aria-label="Close modal">×</button>
            </div>
            <form id="taskForm">
                <label>Task title<input id="taskTitle" type="text" required maxlength="80" placeholder="e.g. Plan sprint review"></label>
                <label>Task description<textarea id="taskDescription" rows="4" required maxlength="240" placeholder="Describe what needs to be done..."></textarea></label>
                <label>Priority<select id="taskPriority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></label>
                <div class="modal-actions"><button class="secondary-button" id="cancelModalButton" type="button">Cancel</button><button class="primary-button" type="submit">Save Task</button></div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
